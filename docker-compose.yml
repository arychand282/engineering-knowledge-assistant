services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eka_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-engineering_knowledge_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-eka} -d ${POSTGRES_DB:-engineering_knowledge_assistant}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - eka_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  eka_postgres_data:
  eka_ollama_data:
